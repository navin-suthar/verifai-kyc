<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <title>VerifAI · KYC Document Intelligence (Demo)</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash of light mode.
      // Theme preference is non-sensitive UI state, so localStorage is acceptable here.
      (function () {
        try {
          var t = localStorage.getItem('verifai.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (!t && prefersDark)) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
